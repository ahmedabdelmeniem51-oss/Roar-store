<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROAR STORE | متجر ألعاب PlayStation</title>
<meta name="description" content="ROAR STORE - متجرك الأول لألعاب PlayStation 5 و PlayStation 4 بأفضل الأسعار">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Reem+Kufi:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ========== RESET ========== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg-main: #0A1628;
    --bg-secondary: #1A2B4A;
    --bg-card: #152238;
    --accent: #E63946;
    --accent-hover: #c42d38;
    --green: #06D6A0;
    --gold: #FFB800;
    --text: #FFFFFF;
    --text-secondary: #A0ABBF;
    --border: rgba(255,255,255,0.08);
    --shadow: 0 10px 30px rgba(0,0,0,0.3);
}

html { scroll-behavior: smooth; }

body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg-main);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 80px;
}

a { text-decoration: none; color: inherit; }
img { max-width: 100%; display: block; }
ul { list-style: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

.container { max-width: 1400px; margin: 0 auto; padding: 0 16px; }

/* ========== NAVBAR ========== */
.navbar {
    background: var(--bg-main);
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 1000;
    transition: all 0.3s;
}

.navbar .container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    flex-shrink: 0;
}

.logo-icon {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, var(--accent), var(--gold));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    color: #fff;
    box-shadow: 0 6px 20px rgba(230,57,70,0.4);
}

.logo-text h1 {
    font-size: 1.1rem;
    font-family: 'Reem Kufi', sans-serif;
    font-weight: 900;
    line-height: 1;
    color: #fff;
}

.logo-text span {
    font-size: 0.65rem;
    color: var(--text-secondary);
    letter-spacing: 3px;
    font-weight: 500;
}

.nav-actions { display: flex; align-items: center; gap: 8px; }

.nav-icon-btn {
    width: 42px;
    height: 42px;
    background: var(--bg-secondary);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 1.1rem;
    transition: all 0.3s;
    border: 1px solid var(--border);
}

.nav-icon-btn:hover, .nav-icon-btn:active {
    background: var(--accent);
    border-color: var(--accent);
    transform: scale(1.05);
}

.nav-icon-btn.whatsapp {
    background: linear-gradient(135deg, #25D366, #128C7E);
    border-color: transparent;
}

/* ========== HERO ========== */
.hero-section { padding: 20px 0 30px; }

.hero-slider {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 20px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.hero-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.8s ease;
    cursor: pointer;
    background-size: cover;
    background-position: center;
}

.hero-slide.active { opacity: 1; z-index: 2; }

.hero-slide::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 0%, transparent 30%, rgba(10,22,40,0.6) 70%, rgba(10,22,40,0.95) 100%);
    z-index: 1;
}

.hero-content {
    position: absolute;
    bottom: 0;
    right: 0;
    left: 0;
    padding: 24px 20px;
    z-index: 3;
    text-align: right;
}

.hero-badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    padding: 5px 14px;
    border-radius: 50px;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    box-shadow: 0 4px 15px rgba(230,57,70,0.5);
}

.hero-content h2 {
    font-family: 'Reem Kufi', sans-serif;
    font-size: 1.6rem;
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 8px;
    color: #fff;
    text-shadow: 0 4px 20px rgba(0,0,0,0.9);
}

.hero-content .hero-price {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--green);
    margin-bottom: 14px;
    display: block;
}

.btn-hero {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    padding: 12px 28px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 0.9rem;
    transition: all 0.3s;
    box-shadow: 0 6px 20px rgba(230,57,70,0.4);
}

.btn-hero:hover, .btn-hero:active {
    background: var(--accent-hover);
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(230,57,70,0.6);
}

.slider-dots {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 10;
}

.dot {
    width: 8px;
    height: 8px;
    background: rgba(255,255,255,0.4);
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.3s;
}

.dot.active {
    background: var(--accent);
    width: 24px;
    border-radius: 4px;
}

/* ========== SECTION ========== */
.section { padding: 30px 0; }

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.section-header h2 {
    font-family: 'Reem Kufi', sans-serif;
    font-size: 1.4rem;
    font-weight: 800;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
}

.section-header h2::before {
    content: '';
    width: 4px;
    height: 24px;
    background: linear-gradient(180deg, var(--accent), var(--gold));
    border-radius: 2px;
}

.view-all-btn {
    color: var(--accent);
    font-weight: 700;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.3s;
    padding: 8px 14px;
    border-radius: 50px;
    background: rgba(230,57,70,0.1);
    border: 1px solid rgba(230,57,70,0.2);
}

.view-all-btn:hover, .view-all-btn:active {
    background: var(--accent);
    color: #fff;
    gap: 10px;
}

/* ========== GAMES GRID ========== */
.games-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.game-card {
    background: var(--bg-card);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s;
    border: 1px solid var(--border);
    position: relative;
}

.game-card:active { transform: scale(0.98); }

.game-image {
    position: relative;
    aspect-ratio: 2/3;
    overflow: hidden;
    background: var(--bg-secondary);
}

.game-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s;
}

.game-card:hover .game-image img { transform: scale(1.08); }

.game-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 4px 10px;
    border-radius: 50px;
    font-size: 0.65rem;
    font-weight: 800;
    color: #fff;
    z-index: 2;
    backdrop-filter: blur(10px);
}

.badge-pre { background: var(--accent); }
.badge-new { background: var(--green); color: #000; }
.badge-hot { background: var(--gold); color: #000; }
.badge-other { background: #6C5CE7; color: #fff; }

.game-info { padding: 12px; }

.game-info h3 {
    font-size: 0.85rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 36px;
}

.game-price {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 4px;
}

.game-price small {
    color: var(--text-secondary);
    font-weight: 400;
    font-size: 0.7rem;
}

/* ========== LOAD MORE ========== */
.load-more-container { text-align: center; padding: 24px 0; display: none; }

.load-more-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--accent), var(--gold));
    color: #fff;
    padding: 14px 40px;
    border-radius: 50px;
    font-weight: 800;
    font-size: 0.95rem;
    transition: all 0.3s;
    box-shadow: 0 10px 30px rgba(230,57,70,0.4);
}

.load-more-btn:hover, .load-more-btn:active {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(230,57,70,0.6);
}

/* ========== PAGES ========== */
.page { display: none; animation: fadeIn 0.4s ease; }
.page.active { display: block; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ========== SEARCH ========== */
.search-section { padding: 16px 0; }

.search-bar { position: relative; width: 100%; }

.search-bar input {
    width: 100%;
    padding: 14px 48px 14px 20px;
    background: var(--bg-secondary);
    border: 2px solid var(--border);
    border-radius: 50px;
    color: #fff;
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
    transition: all 0.3s;
}

.search-bar input:focus {
    border-color: var(--accent);
    background: var(--bg-card);
    box-shadow: 0 0 0 4px rgba(230,57,70,0.15);
}

.search-bar input::placeholder { color: var(--text-secondary); }

.search-bar i {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent);
    font-size: 1rem;
    pointer-events: none;
}

/* ========== FILTERS ========== */
.filters-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 16px;
    scrollbar-width: none;
}

.filters-bar::-webkit-scrollbar { display: none; }

.filter-btn {
    padding: 10px 20px;
    background: var(--bg-secondary);
    border: 1.5px solid var(--border);
    border-radius: 50px;
    color: var(--text-secondary);
    font-weight: 700;
    font-size: 0.82rem;
    white-space: nowrap;
    transition: all 0.3s;
    flex-shrink: 0;
}

.filter-btn:hover, .filter-btn:active {
    border-color: var(--accent);
    color: var(--accent);
}

.filter-btn.active {
    background: linear-gradient(135deg, var(--accent), var(--gold));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 6px 20px rgba(230,57,70,0.4);
}

/* ========== RESULTS COUNT ========== */
.results-count {
    color: var(--text-secondary);
    font-size: 0.85rem;
    padding: 0 4px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.results-count strong { color: var(--accent); font-size: 1rem; }

/* ========== NO RESULTS ========== */
.no-results { text-align: center; padding: 60px 20px; display: none; }
.no-results.show { display: block; }
.no-results i { font-size: 3rem; color: var(--text-secondary); opacity: 0.3; margin-bottom: 16px; }
.no-results h3 { font-size: 1.2rem; color: #fff; margin-bottom: 8px; }
.no-results p { color: var(--text-secondary); font-size: 0.9rem; }

/* ========== LOADING ========== */
.loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    gap: 20px;
}

.loading-spinner {
    width: 50px;
    height: 50px;
    border: 4px solid var(--bg-secondary);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loading-screen p { color: var(--text-secondary); font-weight: 700; }

/* ========== GAME DETAIL ========== */
.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-secondary);
    color: #fff;
    padding: 10px 20px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 0.85rem;
    border: 1px solid var(--border);
    margin-bottom: 16px;
    transition: all 0.3s;
}

.back-btn:hover, .back-btn:active {
    background: var(--accent);
    border-color: var(--accent);
}

.game-hero {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 20px;
    overflow: hidden;
    background: #000;
    margin-bottom: 20px;
    background-size: cover;
    background-position: center;
}

.game-hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 0%, transparent 30%, rgba(10,22,40,0.7) 70%, rgba(10,22,40,0.98) 100%);
}

.game-hero-content {
    position: absolute;
    bottom: 0;
    right: 0;
    left: 0;
    padding: 20px;
    z-index: 2;
    display: flex;
    gap: 16px;
    align-items: flex-end;
}

.game-cover-box {
    width: 90px;
    flex-shrink: 0;
    aspect-ratio: 2/3;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    border: 2px solid rgba(255,255,255,0.15);
    transform: translateY(-8px);
}

.game-cover-box img { width: 100%; height: 100%; object-fit: cover; }

.game-hero-info { flex: 1; padding-bottom: 4px; }

.game-hero-info h1 {
    font-family: 'Reem Kufi', sans-serif;
    font-size: 1.3rem;
    font-weight: 900;
    color: #fff;
    margin-bottom: 10px;
    line-height: 1.2;
    text-shadow: 0 4px 20px rgba(0,0,0,0.9);
}

.game-meta { display: flex; gap: 16px; flex-wrap: wrap; }
.meta-item { display: flex; flex-direction: column; gap: 2px; }
.meta-label { font-size: 0.6rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
.meta-value { font-size: 0.72rem; font-weight: 700; color: #fff; line-height: 1.3; }

.detail-section {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
}

.detail-section h2 {
    font-family: 'Reem Kufi', sans-serif;
    font-size: 1.05rem;
    font-weight: 800;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
}

.detail-section h2 i { color: var(--accent); font-size: 1rem; }

.detail-section p { color: var(--text-secondary); font-size: 0.85rem; line-height: 1.8; }

.video-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
}

.video-wrapper iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
}

.platform-title {
    font-size: 0.9rem;
    font-weight: 800;
    color: var(--accent);
    margin: 16px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.platform-title:first-child { margin-top: 0; }

.variants-list { display: flex; flex-direction: column; gap: 8px; }

.variant-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px;
    background: var(--bg-secondary);
    border-radius: 12px;
    border: 1px solid var(--border);
    transition: all 0.3s;
    cursor: pointer;
}

.variant-item:active { transform: scale(0.98); border-color: var(--accent); }
.variant-item.out-of-stock { opacity: 0.5; cursor: not-allowed; }

.variant-info { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.variant-title { font-weight: 700; font-size: 0.82rem; color: #fff; }
.variant-region { font-size: 0.7rem; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }

.variant-price-box { text-align: left; display: flex; flex-direction: column; gap: 2px; }
.variant-old-price {
    font-size: 0.7rem;
    color: var(--text-secondary);
    text-decoration: line-through;
}
.variant-price {
    font-size: 1rem;
    font-weight: 900;
    color: var(--green);
    font-family: 'Reem Kufi', sans-serif;
}

.btn-whatsapp {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: #fff;
    border-radius: 14px;
    font-size: 0.95rem;
    font-weight: 800;
    transition: all 0.3s;
    margin-top: 16px;
    box-shadow: 0 10px 30px rgba(37,211,102,0.3);
}

.btn-whatsapp:hover, .btn-whatsapp:active {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(37,211,102,0.5);
}

/* ========== MOBILE NAV ========== */
.mobile-nav {
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    padding: 8px 0 max(8px, env(safe-area-inset-bottom));
    z-index: 999;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
    backdrop-filter: blur(20px);
}

.mobile-nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 16px;
    color: var(--text-secondary);
    font-size: 0.7rem;
    font-weight: 700;
    transition: all 0.3s;
    border-radius: 12px;
    cursor: pointer;
}

.mobile-nav-item i { font-size: 1.2rem; }

.mobile-nav-item.active {
    color: var(--accent);
    background: rgba(230,57,70,0.1);
}

/* ========== RESPONSIVE ========== */
@media (min-width: 640px) {
    .container { padding: 0 24px; }
    .games-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .hero-content h2 { font-size: 2.2rem; }
    .game-hero-info h1 { font-size: 1.8rem; }
    .game-cover-box { width: 120px; }
    .game-info h3 { font-size: 0.95rem; min-height: 40px; }
}

@media (min-width: 1024px) {
    .container { padding: 0 32px; }
    .navbar { padding: 16px 0; }
    .logo-text h1 { font-size: 1.4rem; }
    .logo-icon { width: 52px; height: 52px; font-size: 1.5rem; }
    .hero-slider { aspect-ratio: 16/6; border-radius: 24px; }
    .hero-content { padding: 40px 50px; max-width: 600px; }
    .hero-content h2 { font-size: 3rem; }
    .hero-content .hero-price { font-size: 1.2rem; }
    .btn-hero { padding: 16px 40px; font-size: 1rem; }
    .games-grid { grid-template-columns: repeat(5, 1fr); gap: 20px; }
    .section { padding: 50px 0; }
    .section-header h2 { font-size: 1.8rem; }
    .game-hero { aspect-ratio: 16/5; border-radius: 24px; }
    .game-hero-content { padding: 40px; gap: 30px; }
    .game-cover-box { width: 180px; transform: translateY(-20px); }
    .game-hero-info h1 { font-size: 2.5rem; }
    .meta-label { font-size: 0.72rem; }
    .meta-value { font-size: 0.85rem; }
    .game-detail-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; }
    .mobile-nav { display: none; }
    body { padding-bottom: 0; }
}
</style>
</head>
<body>

<!-- ========== LOADING SCREEN ========== -->
<div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <p>جاري تحميل الألعاب...</p>
</div>

<!-- ========== MAIN CONTENT ========== -->
<div id="mainContent" style="display: none;">

    <!-- ========== NAVBAR ========== -->
    <nav class="navbar">
        <div class="container">
            <div class="logo" onclick="showPage('home')">
                <div class="logo-icon"><i class="fas fa-crown"></i></div>
                <div class="logo-text">
                    <h1>ROAR</h1>
                    <span>STORE</span>
                </div>
            </div>
            <div class="nav-actions">
                <button class="nav-icon-btn" onclick="showPage('all-games')" aria-label="البحث">
                    <i class="fas fa-search"></i>
                </button>
                <a href="https://wa.me/201233364676" target="_blank" class="nav-icon-btn whatsapp" aria-label="واتساب">
                    <i class="fab fa-whatsapp"></i>
                </a>
            </div>
        </div>
    </nav>

    <!-- ========== PAGE: HOME ========== -->
    <div id="page-home" class="page active">

        <!-- Hero Slider -->
        <section class="hero-section">

                <button class="filter-btn" data-filter="other">أخرى</button>

            <div class="results-count">
                <span>عرض <strong id="resultsCount">0</strong> لعبة</span>
                <span id="totalCount"></span>
            </div>
        </div>

        <section class="section" style="padding-top: 0;">
            <div class="container">
                <div class="games-grid" id="allGamesGrid"></div>

                <!-- Load More -->

                    </button>

                <div class="no-results" id="noResults">
                    <i class="fas fa-search"></i>

    <!-- ========== PAGE: GAME DETAIL ========== -->

        <section class="section">

                <button class="back-btn" onclick="goBack()">
                    <i class="fas fa-arrow-right"></i> رجوع

                <div id="gameDetailContent"></div>

            <span>الرئيسية</span>
        </div>
        <div class="mobile-nav-item" onclick="showPage('all-games')" id="mobGames">
            <i class="fas fa-gamepad"></i>
            <span>الألعاب</span>
        </div>
        <a href="https://wa.me/201233364676" target="_blank" class="mobile-nav-item">
            <i class="fab fa-whatsapp"></i>
            <span>واتساب</span>
        </a>
    </div>

</div>
<!-- ========== END MAIN CONTENT ========== -->
<script>
// ============================================
// ⚙️ الإعدادات
// ============================================
const WHATSAPP_NUMBER = '201233364676'; // ← رقم واتساب
const BASE_URL = 'https://breakers-store.site'; // ← رابط الصور
const PRICE_ADD = 100; // ← زيادة ثابتة على كل سعر
const GAMES_PER_PAGE = 20; // ← عدد الألعاب في كل تحميل

// رابط ملف الألعاب على GitHub
const GAMES_JSON_URL = 'https://raw.githubusercontent.com/ahmedabdelmeniem51-oss/GAME./main/breakers-games-509.json';

// ============================================
// البيانات (متغير عام)
// ============================================
let gamesData = [];
let previousPage = 'home';
let currentSlide = 0;
let totalSlides = 0;
let sliderInterval;
let currentFilter = 'all';
let currentQuery = '';
let displayedCount = GAMES_PER_PAGE;

// ============================================
// تحويل رابط يوتيوب لـ embed
// ============================================
function getEmbedUrl(url) {
    if (!url) return '';
    let videoId = '';
    if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1].split('?')[0];
    } else if (url.includes('youtube.com/watch')) {
        try { videoId = new URL(url).searchParams.get('v'); } catch(e) { videoId = ''; }
    }
    return videoId ? `https://www.youtube-nocookie.com/embed/${videoId}` : '';
}

// ============================================
// تعديل رابط الصورة (BASE_URL)
// ============================================
function fixImageUrl(path) {
    if (!path) return '';
    if (path.startsWith('http')) return path;
    return BASE_URL + path;
}

// ============================================
// تحديد التصنيف من JSON
// ============================================
function getCategory(game) {
    if (game.promotion === 'PRE_ORDER' || (game.tags && game.tags.includes('PRE_ORDER'))) return 'pre';
    if (game.tags && game.tags.includes('NEW_ARRIVAL')) return 'new';
    if (game.promotion === 'FLASH_SALE' || (game.tags && game.tags.includes('TOP_SELLERS'))) return 'hot';
    return 'other';
}

function getBadge(game) {
    if (game.promotion === 'PRE_ORDER') return { text: 'Pre-Order', type: 'badge-pre' };
    if (game.promotion === 'FLASH_SALE') return { text: 'عرض خاص', type: 'badge-hot' };
    if (game.tags && game.tags.includes('NEW_ARRIVAL')) return { text: 'وصل حديثاً', type: 'badge-new' };
    if (game.tags && game.tags.includes('TOP_SELLERS')) return { text: 'الأكثر مبيعاً', type: 'badge-hot' };
    return { text: 'متاح', type: 'badge-other' };
}

// ============================================
// تحويل شكل اللعبة من JSON لشكل العرض
// ============================================
function transformGame(game) {
    const badge = getBadge(game);
    const spaceMb = game.metadata?.spaceUsedMb || 0;
    const spaceGB = spaceMb > 0 ? Math.round(spaceMb / 1024) + ' GB' : 'غير محدد';
    const languages = game.metadata?.languages?.map(l => l.name).join(' / ') || 'English';
    const genres = game.genres?.map(g => g.name.trim()).join(' / ') || '';

    // تجميع المنصات
    const platforms = [...new Set(game.variants.map(v => v.launcher || 'Other'))].join(' / ');

    return {
        id: game.id,
        title: game.title,
        slug: game.slug,
        description: game.description,
        cover: fixImageUrl(game.thumbnailUrl),
        hero: fixImageUrl(game.coverImageUrl),
        video: game.videoUrl,
        category: getCategory(game),
        badge: badge.text,
        badgeType: badge.type,
        space: spaceGB,
        platforms: platforms,
        genres: genres,
        languages: languages,
        variants: game.variants.map(v => {
            // ✅ السعر الأصلي + 100
            const basePrice = (v.priceEGP || 0) + PRICE_ADD;
            
            // ✅ هل عليه خصم؟
            const hasDiscount = (v.discountPercentage || 0) > 0;
            
            // ✅ الخصم يتخصم من السعر الأصلي (اللي هو priceEGP مش من اللي بعده +100)
            const discountAmount = hasDiscount 
                ? Math.round((v.priceEGP || 0) * v.discountPercentage / 100) 
                : 0;
            
            // ✅ السعر النهائي = السعر الأصلي + 100 - الخصم
            const finalPrice = Math.round((v.priceEGP || 0) - discountAmount + PRICE_ADD);
            
            return {
                title: v.title,
                platform: v.launcher || 'Other',
                region: v.region || 'GLOBAL',
                originalPrice: basePrice,
                price: finalPrice,
                hasDiscount: hasDiscount,
                discountPercentage: v.discountPercentage || 0,
                stock: v.stockStatus === 'IN_STOCK'
            };
        })
    };
}

// ============================================
// تحميل الألعاب من GitHub
// ============================================
async function loadGames() {
    try {
        const res = await fetch(GAMES_JSON_URL);
        if (!res.ok) throw new Error('فشل تحميل الملف');
        const rawGames = await res.json();
        gamesData = rawGames.map(transformGame).filter(g => g.title);
        console.log('✅ تم تحميل', gamesData.length, 'لعبة');
        return true;
    } catch (err) {
        console.error('❌ فشل تحميل الألعاب:', err);
        return false;
    }
}

// ============================================
// Hero Slider
// ============================================
function renderHeroSlider() {
    const slider = document.getElementById('heroSlider');
    if (!slider) return;
    const heroGames = gamesData.slice(0, 5);
    totalSlides = heroGames.length;
    if (totalSlides === 0) return;

    let slidesHTML = '';
    let dotsHTML = '';

    heroGames.forEach((game, index) => {
        const availableVariants = game.variants.filter(v => v.stock);
        const minPrice = availableVariants.length
            ? Math.min(...availableVariants.map(v => v.price))
            : Math.min(...game.variants.map(v => v.price));

        slidesHTML += `
            <div class="hero-slide ${index === 0 ? 'active' : ''}"
                 style="background-image: url('${game.hero}');"
                 onclick="showGame('${game.id}')">
                <div class="hero-content">
                    <span class="hero-badge">${game.badge}</span>
                    <h2>${game.title}</h2>
                    <span class="hero-price">يبدأ من ${minPrice.toLocaleString()} ج.م</span>
                    <button class="btn-hero">
                        <i class="fas fa-shopping-bag"></i> اطلب الآن
                    </button>
                </div>
            </div>
        `;
        dotsHTML += `<div class="dot ${index === 0 ? 'active' : ''}" onclick="event.stopPropagation(); goToSlide(${index})"></div>`;
    });

    slider.innerHTML = slidesHTML + `<div class="slider-dots">${dotsHTML}</div>`;

    clearInterval(sliderInterval);
    sliderInterval = setInterval(() => {
        currentSlide = (currentSlide + 1) % totalSlides;
        goToSlide(currentSlide);
    }, 5000);
}

function goToSlide(index) {
    const slides = document.querySelectorAll('.hero-slide');
    const dots = document.querySelectorAll('.dot');
    slides.forEach(s => s.classList.remove('active'));
    dots.forEach(d => d.classList.remove('active'));
    if (slides[index]) slides[index].classList.add('active');
    if (dots[index]) dots[index].classList.add('active');
    currentSlide = index;
}

// ============================================
// عرض شبكة الألعاب
// ============================================
function renderGamesGrid(containerId, games, limit) {
    const container = document.getElementById(containerId);
    if (!container) return;
    const displayGames = limit ? games.slice(0, limit) : games;

    if (displayGames.length === 0) {
        container.innerHTML = '<p style="color: var(--text-secondary); grid-column: 1/-1; text-align: center; padding: 30px;">لا توجد ألعاب</p>';
        return;
    }

    container.innerHTML = displayGames.map(game => {
        const availableVariants = game.variants.filter(v => v.stock);
        const minPrice = availableVariants.length
            ? Math.min(...availableVariants.map(v => v.price))
            : null;

        return `
            <div class="game-card" onclick="showGame('${game.id}')">
                <div class="game-image">
                    <img src="${game.cover}" alt="${game.title}" loading="lazy"
                         onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=&quot;display:flex;align-items:center;justify-content:center;height:100%;background:#1A2B4A;color:#A0ABBF;font-size:11px;text-align:center;padding:10px;&quot;>صورة غير متوفرة</div>';">
                    <span class="game-badge ${game.badgeType}">${game.badge}</span>
                </div>
                <div class="game-info">
                    <h3>${game.title}</h3>
                    <div class="game-price">
                        ${minPrice ? `يبدأ من ${minPrice.toLocaleString()} <small>ج.م</small>` : 'غير متاح'}
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

// ============================================
// عرض صفحة اللعبة
// ============================================
function showGame(gameId) {
    const game = gamesData.find(g => g.id === gameId);
    if (!game) return;

    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-game').classList.add('active');
    if (document.getElementById('mobHome')) document.getElementById('mobHome').classList.remove('active');
    if (document.getElementById('mobGames')) document.getElementById('mobGames').classList.remove('active');

    // تجميع النسخ حسب المنصة
    const variantsByPlatform = {};
    game.variants.forEach(v => {
        if (!variantsByPlatform[v.platform]) variantsByPlatform[v.platform] = [];
        variantsByPlatform[v.platform].push(v);
    });

   const renderVariant = (v) => {
    const message = `السلام عليكم 🌟
أريد شراء اللعبة التالية:

🎮 اللعبة: ${game.title}
📦 النسخة: ${v.title} (${v.platform})
🌍 المنطقة: ${v.region}
💰 السعر: ${v.price.toLocaleString()} ج.م`;
    
    const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    
    return `
        <div class="variant-item ${v.stock ? '' : 'out-of-stock'}"
             ${v.stock ? `onclick="window.open('${waLink}', '_blank')"` : ''}>
            <div class="variant-info">
                <span class="variant-title">${v.title}</span>
                <span class="variant-region"><i class="fas fa-globe"></i> ${v.region}</span>
            </div>
            <div class="variant-price-box">
                ${v.hasDiscount ? `<span class="variant-old-price">${v.originalPrice.toLocaleString()} ج.م</span>` : ''}
                <span class="variant-price">${v.price.toLocaleString()} ج.م</span>
                ${!v.stock ? '<small style="color:#E63946;font-size:0.7rem;">غير متاح</small>' : ''}
            </div>
        </div>
    `;
};

    let variantsHTML = '';
    Object.keys(variantsByPlatform).forEach(platform => {
        let platformIcon = 'gamepad';
        if (platform === 'PS5' || platform === 'PS4') platformIcon = 'playstation';
        else if (platform === 'STEAM' || platform === 'PC') platformIcon = 'steam';
        else if (platform === 'XBOX_SERIES_X' || platform === 'XBOX_ONE') platformIcon = 'xbox';
        else if (platform === 'UBISOFT_CONNECT') platformIcon = 'u';
        else if (platform === 'ROCKSTAR_GAMES') platformIcon = 'rockstar';
        else if (platform === 'EPIC') platformIcon = 'e';

        variantsHTML += `
            <div class="platform-title">
                <i class="fab fa-${platformIcon}"></i>
                ${platform}
            </div>
            <div class="variants-list">
                ${variantsByPlatform[platform].map(renderVariant).join('')}
            </div>
        `;
    });

    const embedUrl = getEmbedUrl(game.video);

    document.getElementById('gameDetailContent').innerHTML = `
        <div class="game-hero" style="background-image: url('${game.hero}');">
            <div class="game-hero-content">
                <div class="game-cover-box">
                    <img src="${game.cover}" alt="${game.title}"
                         onerror="this.parentElement.innerHTML='<div style=&quot;display:flex;align-items:center;justify-content:center;aspect-ratio:2/3;background:#1A2B4A;color:#A0ABBF;font-size:10px;text-align:center;padding:10px;&quot;>صورة</div>';">
                </div>
                <div class="game-hero-info">
                    <h1>${game.title}</h1>
                    <div class="game-meta">
                        <div class="meta-item">
                            <span class="meta-label">المساحة</span>
                            <span class="meta-value">${game.space}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">المنصات</span>
                            <span class="meta-value">${game.platforms}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">التصنيفات</span>
                            <span class="meta-value">${game.genres}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="game-detail-grid">
            <div>
                ${embedUrl ? `
                <div class="detail-section">
                    <h2><i class="fas fa-play-circle"></i> فيديو اللعبة</h2>
                    <div class="video-wrapper">
                        <iframe src="${embedUrl}" allowfullscreen
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
                        </iframe>
                    </div>
                </div>
                ` : ''}

                <div class="detail-section">
                    <h2><i class="fas fa-info-circle"></i> عن اللعبة</h2>
                    <p>${game.description || 'لا يوجد وصف'}</p>
                </div>
            </div>

            <div>
                <div class="detail-section">
                    <h2><i class="fas fa-shopping-cart"></i> اختر النسخة</h2>
                    ${variantsHTML}

                    <a href="https://wa.me/${WHATSAPP_NUMBER}" target="_blank" class="btn-whatsapp">
                        <i class="fab fa-whatsapp"></i> اطلب الآن عبر واتساب
                    </a>
                </div>
            </div>
        </div>
    `;

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================
// التنقل بين الصفحات
// ============================================
function showPage(pageName) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const target = document.getElementById('page-' + pageName);
    if (target) target.classList.add('active');

    document.querySelectorAll('.mobile-nav-item').forEach(item => item.classList.remove('active'));
    if (pageName === 'home' && document.getElementById('mobHome')) document.getElementById('mobHome').classList.add('active');
    if (pageName === 'all-games' && document.getElementById('mobGames')) document.getElementById('mobGames').classList.add('active');

    if (pageName === 'all-games') renderAllGames();
    if (pageName !== 'game') previousPage = pageName;

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack() { showPage(previousPage || 'home'); }

// ============================================
// صفحة كل الألعاب + البحث + Load More
// ============================================
function getFilteredGames() {
    let filtered = [...gamesData];
    if (currentFilter !== 'all') filtered = filtered.filter(g => g.category === currentFilter);
    if (currentQuery) {
        const q = currentQuery.toLowerCase();
        filtered = filtered.filter(g =>
            g.title.toLowerCase().includes(q) ||
            (g.genres && g.genres.toLowerCase().includes(q))
        );
    }
    return filtered;
}

function renderAllGames() {
    const filtered = getFilteredGames();
    const grid = document.getElementById('allGamesGrid');
    const noResults = document.getElementById('noResults');
    const loadMoreContainer = document.getElementById('loadMoreContainer');
    const resultsCount = document.getElementById('resultsCount');
    const totalCount = document.getElementById('totalCount');

    if (resultsCount) resultsCount.textContent = Math.min(displayedCount, filtered.length);
    if (totalCount) totalCount.textContent = `من أصل ${filtered.length} لعبة`;

    if (filtered.length === 0) {
        grid.innerHTML = '';
        noResults.classList.add('show');
        loadMoreContainer.style.display = 'none';
        return;
    }

    noResults.classList.remove('show');
    const displayGames = filtered.slice(0, displayedCount);

    grid.innerHTML = displayGames.map(game => {
        const availableVariants = game.variants.filter(v => v.stock);
        const minPrice = availableVariants.length
            ? Math.min(...availableVariants.map(v => v.price))
            : null;

        return `
            <div class="game-card" onclick="showGame('${game.id}')">
                <div class="game-image">
                    <img src="${game.cover}" alt="${game.title}" loading="lazy"
                         onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=&quot;display:flex;align-items:center;justify-content:center;height:100%;background:#1A2B4A;color:#A0ABBF;font-size:11px;text-align:center;padding:10px;&quot;>صورة غير متوفرة</div>';">
                    <span class="game-badge ${game.badgeType}">${game.badge}</span>
                </div>
                <div class="game-info">
                    <h3>${game.title}</h3>
                    <div class="game-price">
                        ${minPrice ? `يبدأ من ${minPrice.toLocaleString()} <small>ج.م</small>` : 'غير متاح'}
                    </div>
                </div>
            </div>
        `;
    }).join('');

    loadMoreContainer.style.display = displayedCount < filtered.length ? 'block' : 'none';
}

function loadMore() {
    displayedCount += GAMES_PER_PAGE;
    renderAllGames();
}

function filterFromNav(filter) {
    currentFilter = filter;
    currentQuery = '';
    displayedCount = GAMES_PER_PAGE;

    document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.filter === filter);
    });

    const searchInput = document.getElementById('searchInput');
    if (searchInput) searchInput.value = '';

    showPage('all-games');
}

// ============================================
// بدء التشغيل
// ============================================
async function init() {
    const ok = await loadGames();

    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';

    if (!ok || gamesData.length === 0) {
        document.getElementById('mainContent').innerHTML = `
            <div style="text-align:center;padding:80px 20px;">
                <i class="fas fa-exclamation-triangle" style="font-size:3rem;color:#E63946;margin-bottom:20px;"></i>
                <h2 style="color:#fff;margin-bottom:10px;">فشل تحميل الألعاب</h2>
                <p style="color:#A0ABBF;">تأكد من اتصالك بالإنترنت وحاول مرة أخرى</p>
                <button onclick="location.reload()" style="margin-top:20px;background:#E63946;color:#fff;padding:12px 30px;border-radius:50px;font-weight:800;cursor:pointer;">إعادة المحاولة</button>
            </div>
        `;
        return;
    }

    renderHeroSlider();
    renderGamesGrid('preGrid', gamesData.filter(g => g.category === 'pre'), 10);
    renderGamesGrid('newGrid', gamesData.filter(g => g.category === 'new'), 10);
    renderGamesGrid('hotGrid', gamesData.filter(g => g.category === 'hot'), 10);

    // Search Input
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        searchInput.addEventListener('input', (e) => {
            currentQuery = e.target.value.trim();
            displayedCount = GAMES_PER_PAGE;
            renderAllGames();
        });
    }

    // Filter Buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            displayedCount = GAMES_PER_PAGE;
            renderAllGames();
        });
    });
}
